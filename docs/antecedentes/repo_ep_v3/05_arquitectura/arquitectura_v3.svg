ext x="44" y="472" class="s" text-anchor="start">Los tres canales entran por el mismo contrato I8, con las mismas validaciones C1–C5 y los mismos códigos de respuesta.</text><rect x="30" y="530" width="22" height="14" rx="3" class="sw1"/><text x="60" y="542" class="s" text-anchor="start">Se mantiene de PC1 (v1.0)</text><rect x="250" y="530" width="22" height="14" rx="3" class="box2"/><text x="280" y="542" class="s" text-anchor="start">Agregado en PC2 (v2.0–v2.1)</text><rect x="480" y="530" width="22" height="14" rx="3" class="box3"/><text x="510" y="542" class="s" text-anchor="start">Cambio del EP (v3.0)</text><text x="700" y="542" class="s" text-anchor="start">Interfaces lógicas I1–I10: mecanismo real por validar (B02)</text></svg>